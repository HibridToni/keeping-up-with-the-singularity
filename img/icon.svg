<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.3" filter="url(#glow)" />
  
  <!-- Event Horizon Accretion Disk Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="700 80" stroke-linecap="round" />
  
  <!-- Secondary Orbit Ring -->
  <ellipse cx="256" cy="256" rx="160" ry="85" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.8" transform="rotate(-30 256 256)" />
  
  <!-- Black Hole Singularity Core -->
  <circle cx="256" cy="256" r="80" fill="#030712" stroke="url(#ringGrad)" stroke-width="4" />
  
  <!-- Center Singularity Light Point -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>